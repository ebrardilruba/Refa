name: refa
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Firebase (çekirdek + auth)
  firebase_core: ^3.14.0
  firebase_auth: ^5.1.0

  # Yerel depolama / bildirim / saat dilimi / izinler / TTS / STT
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.3
  speech_to_text: ^7.1.0

  # PDF
  syncfusion_flutter_pdf: ^30.2.4

  # Dosya seçimi (mobil/desktop/web)
  file_picker: ^8.1.2

  # OCR fallback
  pdfx: ^2.6.0
  google_mlkit_text_recognition: ^0.12.0

  # Konfeti
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon_fg.png       # şeffaf/daire PNG
    - assets/icons/icon_mono.png     # monokrom PNG

# Uygulama ikonu (Android adaptive + monokrom)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon_fg.png"
  adaptive_icon_background: "#132542"
  adaptive_icon_foreground: "assets/icons/icon_fg.png"
  adaptive_icon_monochrome: "assets/icons/icon_mono.png"

# Native splash (ilk ekran)
flutter_native_splash:
  color: "#0F172A"
  image: assets/icons/icon_fg.png
  android_gravity: center
  android_12:
    color: "#0F172A"
    image: assets/icons/icon_fg.png
