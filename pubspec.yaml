name: refa
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Yerel depolama / bildirim / saat dilimi / izinler / TTS / STT
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.3
  speech_to_text: ^7.1.0   # yeni Android embedding ile uyumlu

  # PDF
  syncfusion_flutter_pdf: ^30.2.4

  # Dosya seçici
  file_selector: ^1.0.3

  # OCR fallback
  pdfx: ^2.6.0
  google_mlkit_text_recognition: ^0.12.0

  # Konfeti
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
